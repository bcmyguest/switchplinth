text: 'Use narrow Docker contexts: each service context includes only its subtree
  and required root files, with caches/build outputs re-ignored. Keep Dockerfiles
  and Compose understandable. Persist `.decision/` in the opened repository; generated
  SQLite/Qdrant data lives in disposable volumes/cache locations. Compose publishes
  UI, API, and Qdrant ports on loopback only and maps `host.docker.internal` to the
  host gateway for local model servers. The API is unauthenticated, so external listener
  access remains unresolved and outside the V0 listener contract. Avoid adding services
  in V0.'
