text: Markdown and `.decision/` YAML are portable project data. Provider credentials
  are referenced through environment variable names such as `env:MODEL_API_KEY`; secret
  values are not written to YAML. Local `openai_compatible` endpoints may omit `credential_ref`;
  an explicit `env:` reference is preserved and used when configured. Blank optional
  connection fields are omitted from saved `model_connection` records. Inferred records
  retain evidence anchors and confidence, and human reviews are appended as superseding
  records.
