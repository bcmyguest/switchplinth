text: V0 operations add, remove, or replace entities and relationships. Each operation
  has a compiler-validated shape and stable target ID. Operations may carry `expect`
  preconditions to detect stale base assumptions; the field is optional. Deltas describe
  changes relative to the shared base, not full copied snapshots. V1 requires `kind`
  strings but does not constrain entity kinds or relationship kinds to a closed vocabulary.
  It types claim predicates as strings; the compiler recognizes a code-defined set
  of structural predicates.
