text: For this example, the `architecture` base is compiled from effective portable
  entity and relationship claims after rejected claims are excluded and human precedence
  is applied. It contains `service-orders` and has no selected event transport. Each
  option independently adds its own technology and `publishes_to` relationship. Applying
  Kafka and SQS as competing selections together is invalid because the decision permits
  one selected option. A replacement delta removing an existing component must identify
  the target and include an `expect` precondition matching the base or an earlier
  composed operation.
