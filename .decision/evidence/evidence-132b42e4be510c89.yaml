text: Compose mounts `${DECISION_WORKSPACE_HOST:-.}` at `/workspace/repos` (the current
  directory by default). The repository chooser lists Markdown repositories under
  that mounted directory; selected paths are relative, and paths that traverse symlinks
  or escape the mount are rejected. New Markdown-only repositories receive a portable
  `.decision/` v1 schema, config, and instructions on first open. To mount a different
  workspace, set `DECISION_WORKSPACE_HOST` before starting Compose.
