text: 1. Open a local repository. 2. Select a configured AI provider or use deterministic/mock
  extraction. 3. Discover likely decision-bearing Markdown artifacts and extract candidate
  decisions, options, entities, aliases, relationships, evidence, and consequences.
  4. Review “what we think your architecture is.” Inspect evidence and confirm, reject,
  or correct uncertain claims and alias mappings. 5. Browse the resulting graph. Select
  an entity to see rationale from an active linked option, any linked unselected option
  marked as an alternative, related decisions, and source evidence. 6. Select different
  decision options to compose a scenario. The graph and affected decisions, conflicts,
  invalid assumptions, and evidence update promptly. 7. Ask a grounded question such
  as “Why are we using Kafka?” and inspect the supporting passages and claims. 8.
  Edit the same domain model in the UI, via portable YAML, or through conversational
  assistance. Re-extraction preserves human decisions.
