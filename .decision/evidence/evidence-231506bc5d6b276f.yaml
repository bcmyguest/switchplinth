text: An option is a list of typed operations against a base graph, not a copied architecture
  snapshot. Scenario composition applies selected decision options in stable order
  to a common graph. Compiler validation checks operation preconditions, referenced
  entities, duplicate/conflicting writes, and decision dependency constraints. The
  scenario view derives changed entities and edges, affected decisions, assumptions
  invalidated, conflicts, and supporting evidence. The same delta payload is read/written
  by YAML, graphical editing, and conversational AI.
