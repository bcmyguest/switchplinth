text: Each record declares `schema_version` and `record_type`. `.decision/schema/record-v1.schema.json`
  validates the shared envelope and supported record shapes, including typed operation
  payloads. The V0 runtime validates fields it uses and checks evidence IDs, entity
  IDs, decision options, and scenario selections. Although the v1 JSON Schema permits
  additional top-level fields, the runtime ignores fields it does not define or consume;
  in particular, decision `context_evidence` and `claims` are not supported v1 relations.
  No v1-to-v2 migration exists. Any future migration must be an explicit deterministic
  transformation that preserves IDs and produces reviewable diffs. Never silently
  rewrite unknown/future versions. Application import validates portable records against
  the schema; this checkout has no CI configuration.
