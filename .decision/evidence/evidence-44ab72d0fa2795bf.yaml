text: Docker Compose runs separate `frontend`, `backend`, and `qdrant` services. The
  frontend is React/TypeScript with Tailwind and shadcn/ui. The backend is Python
  3.12/FastAPI. Published ports bind to loopback. The backend maps `host.docker.internal`
  to the Linux host gateway for local model connections. Local API docs are at `http://localhost:8000/docs`,
  the frontend at `http://localhost:3000`, and Qdrant at `http://localhost:6333`.
