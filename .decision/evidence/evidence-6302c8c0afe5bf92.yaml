text: Evidence IDs survive edits when the indexing process unambiguously relocates
  the same passage. Relocation compares passages within the same repository-relative
  source path, first by normalized passage hash, then by heading path and surrounding
  context. The source record also stores Git blob and file-content hashes when available,
  but the current relocation matcher does not use those values. Reordering or line
  shifts alone do not create new evidence. Ambiguous relocation creates a reviewable
  unresolved anchor rather than silently attaching evidence to a different passage.
  Display lines are optional conveniences.
