text: 'Docker Compose runs three distinct services: `frontend`, `backend`, and `qdrant`.
  The frontend uses React, TypeScript, shadcn/ui, Tailwind, and `@xyflow/react` for
  graph interaction. YAML theme values compile/map to semantic CSS variables. The
  backend is Python/FastAPI. SQLite is local disposable state; Qdrant is a disposable
  vector retrieval index. Neither is authoritative.'
