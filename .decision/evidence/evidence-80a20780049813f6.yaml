text: The workspace has separate Architecture, Architecture log, Progress, and Facts
  pages. Architecture puts Decision assistant near the system map; Architecture log
  lists decisions; Progress displays counts from current graph/evidence data; Facts
  contains Needs a closer look review controls and links to the system map. Scenarios
  and Explore retain scenario selection and grounded assistant workflows. All Discover
  triggers (Source Types, the heading, and source card) open one mode chooser for
  deterministic/mock or provider extraction. Provider extraction passes the selected
  connection ID to `/api/v1/extraction/run`, displays provider/model and saved counts,
  and rebuilds SQLite/Qdrant after saving canonical inferred records; provider errors
  stay visible. Human-reviewed records retain precedence. Do not imply support for
  other source formats or mark the V0 acceptance audit complete from this flow alone.
