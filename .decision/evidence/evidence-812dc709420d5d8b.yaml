text: '- **Source artifact:** repository content, initially Markdown, from which evidence
  is anchored. - **Entity:** an architecture concept such as a service, technology,
  datastore, or interface. - **Claim:** a proposition about an entity, alias, relationship,
  decision, or consequence, with epistemic state and provenance as applicable. - **Alias
  claim:** a separately reviewable claim that a name refers to an entity. - **Decision:**
  the selected-or-undecided choice and its rationale/context. - **Option:** a candidate
  response to a decision, represented by typed operations against a base graph. -
  **Scenario:** a composition of selected options across decisions. - **Evidence anchor:**
  a stable locator and content identity for a source passage. - **Inference:** a machine-proposed
  interpretation, never an unchangeable fact.'
