text: 'The backend exposes deterministic mock extraction and a LiteLLM adapter for
  configured providers. Local `openai_compatible` endpoints can perform structured
  extraction without an API key; hosted OpenAI and Anthropic connections still use
  their configured credentials. A loopback OpenAI-compatible mock test exercises keyless
  and credentialed structured extraction, streaming, and configured embeddings without
  external credentials. Configure `embedding_model` with `capabilities.embeddings:
  true` to use provider embeddings for both Qdrant indexing and querying. Without
  that configuration, V0 reports that provider embeddings are unsupported and uses
  deterministic token-hash vectors as an offline fallback; those vectors are not semantic
  embeddings. Use connection diagnostics to inspect endpoint and model connectivity
  before running provider extraction or proposal. For an HTTP-level check, the backend
  exposes `/health`, OpenAPI at `/docs`, and MCP streamable HTTP at `/mcp`.'
