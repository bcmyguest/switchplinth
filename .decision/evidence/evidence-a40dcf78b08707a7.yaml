text: An optional `agents/` record references an external coding/engineering agent
  and its invocation configuration; it is distinct from `model_connection` and does
  not declare inference capabilities. Agent integration details and transport remain
  unresolved. LiteLLM is an internal adapter, not the portable schema. If no provider
  embedding model is configured, V0 uses deterministic local token-hash vectors; that
  fallback is rebuildable but is not semantic embedding retrieval. Embedding failures
  are reported in scan/search diagnostics and do not silently switch a configured
  provider-backed index to a different vectorizer.
