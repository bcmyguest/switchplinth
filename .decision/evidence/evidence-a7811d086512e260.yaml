text: The public model connection contract is provider-neutral and contains no credentials.
  `provider` selects an adapter name; hosted OpenAI and Anthropic use their provider
  endpoints, while `endpoint` configures compatible/local providers; `model` names
  the inference model. An optional `embedding_model` names a distinct vector model
  when `capabilities.embeddings` is enabled. Diagnostics probe embeddings only when
  that model is supplied, otherwise they report embeddings as unsupported. Credential
  references resolve from runtime environment/secret storage and never inline secret
  material.
