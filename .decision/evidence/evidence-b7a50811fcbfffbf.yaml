text: '- Compose build/start: frontend, backend, and Qdrant healthy; backend `/health`,
  frontend `/`, and proxied `/api/v1/project` returned HTTP 200. - Backend: from `backend/`,
  `env UV_CACHE_DIR=/tmp/uv-cache uv run --locked --python 3.12 pytest -q` passed
  **57 tests** with two deprecation warnings in **77.95s**. After the scenario-key
  fix, `env UV_CACHE_DIR=/tmp/uv-cache uv run --locked --python 3.12 pytest -q tests/test_domain.py
  -k ''task or excluded or scenario_scopes_saved_scenario_options_to_their_decision''`
  passed **11 tests**, with 46 deselected, in **0.78s**. The suite covers local loopback
  provider extraction/embedding diagnostics, option-created entity ownership and claim
  correction, asserted-base conflict reporting, delta-removal precedence, scenario-aware
  search including inactive alternatives, no-write delta preview, a null preview operation
  returning HTTP 422 without changing canonical `.decision/` files, picker security/bootstrap,
  and per-repository Qdrant isolation. - Frontend: from `frontend/`, `./node_modules/.bin/tsc
  -b`, `./node_modules/.bin/eslint .`, and `./node_modules/.bin/vite build` all exited
  0. - Compose: `docker compose config` showed all published ports bound to `127.0.0.1`
  and the backend host-gateway mapping; disposable `docker compose run --rm --no-deps
  backend getent hosts host.docker.internal` resolved to `172.17.0.1`. The long-running
  services were stopped during this check. - Compose acceptance: root verified 98
  points in the root Qdrant collection and 7 points in a separate `examples` collection.
  Switching back without rescanning preserved grounded Kafka rationale/evidence. Kafka→SQS
  detail, picker traversal rejection, and MCP initialize/tools-list/query passed.
  - Disposable fixture end-to-end: a synthetic Markdown source completed provider
  extraction through an OpenAI-compatible test endpoint, then SQLite/Qdrant indexes
  were rebuilt. The rebuild report records nine canonical `.decision/` YAML files
  preserved byte-for-byte and grounded evidence available before and after. This used
  test credentials and does not verify external provider interoperability. - Independent
  UI-PANELS gate 11: live Playwright 1.58.2 Chromium and Firefox each passed 14/14
  layout/interaction cases at 1440, 500, and 375 CSS px, plus source clicks, focused
  panel checks, SQS selected detail, and no-write preview/Discard. All nine live graph
  cards stayed inside the map; adjacent detail, What-if, and editor panels fit without
  document horizontal overflow or page scroll on selection. Fixture-only Save passed
  earlier gate 10. Full V0 acceptance remains pending review of the 12-criterion audit.'
