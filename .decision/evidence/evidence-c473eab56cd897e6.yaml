text: Markdown discovery is deterministic and configurable. Extraction may use rules/mock
  behavior or a provider. Retrieval combines lexical lookup, Qdrant vector lookup,
  alias/entity resolution, graph expansion, provenance filtering, and ranking; responses
  retain links to evidence and claims. When a configured embedding model is available,
  the same LiteLLM-backed vectorizer indexes passages and embeds queries. Without
  one, V0 uses deterministic token-hash vectors as an offline fallback; this is not
  semantic embedding retrieval and the API reports that mode.
