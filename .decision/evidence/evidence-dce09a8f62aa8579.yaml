text: Public provider configuration is the application's own versioned schema. An
  adapter maps it to LiteLLM. Keep model connections (inference, embedding, structured
  output, streaming) separate from coding/engineering agent connections. Diagnostics
  report authentication, endpoint reachability, model availability, structured-output
  support, embedding support, streaming, and latency. `unsupported` means the capability
  is known unavailable; a capability with no implemented protocol-specific probe is
  reported as an error with `capability_probe_not_implemented`, meaning unverified.
  A reachable HTTP 401/403 is an authentication error while endpoint reachability
  remains supported. Hosted OpenAI and Anthropic adapters use their hosted endpoints;
  local/custom URLs belong to compatible/local providers. Secret values remain outside
  committed config.
