text: 'For `why` searches, the backend reports `grounded: true` only when effective
  claims cite the returned current passages. When passages exist without claim support,
  it returns the passages and labels the answer as not fully grounded. Entity and
  alias routing requires a complete multiword name, while single-word aliases remain
  searchable. Generic lexical searches retain passage-based grounding.'
