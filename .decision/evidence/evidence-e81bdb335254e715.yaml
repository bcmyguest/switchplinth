text: 1. `docker compose up --build` starts distinct frontend, backend, and Qdrant
  services locally. 2. A repository with synthetic, non-template-specific Markdown
  can be opened and discovered without ADR-specific formatting. 3. A mock path and
  at least one configured provider path produce candidate portable overlay data. 4.
  Every inferred architectural claim has provenance. Evidence anchors use repository-relative
  identity, Git/content identity where available, structural location, normalized
  passage fingerprint, and context sufficient for relocation; re-indexing reuses anchor
  identity when passage relocation succeeds. 5. Alias mappings have independent confidence,
  evidence, and epistemic status. 6. Human confirmed/rejected/overridden records survive
  extraction and outrank inference. 7. Decisions and options are represented using
  typed deltas over a base graph; selecting/composing options recomputes scenario
  graph effects. 8. The UI supports graph browsing, evidence inspection, entity-linked
  rationale and alternatives, and scenario option switching. 9. A grounded “why are
  we using X?” query returns claims and passages that support the answer and can be
  inspected. 10. Deleting generated SQLite/Qdrant state and rebuilding from canonical
  files restores usable indexes without losing meaningful knowledge. 11. Versioned
  schema validation rejects unsupported versions before mutation; portability, precedence,
  delta application, and anchor relocation are covered by automated checks. Any future
  schema evolution must add and test an explicit deterministic migration. 12. Provider
  diagnostics report every capability as supported, unsupported, or error, including
  actionable raw and normalized failures; unsupported checks are visible rather than
  silently skipped.
