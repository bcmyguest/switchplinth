text: The deterministic domain/compiler does not depend on HTTP, SQLite, Qdrant, or
  model providers. Keep provider-neutral connection records portable and secrets out
  of YAML. Blank optional connection fields are omitted from saved `model_connection`
  records; explicit `env:` credential references are preserved. Local `openai_compatible`
  extraction can run without a credential reference; hosted OpenAI and Anthropic connections
  use their configured credentials. Inferred claims and aliases need evidence; human
  reviews append records and supersede earlier human judgments without rewriting the
  original inference. Keep source anchors relocatable and avoid line numbers as identity.
  Options are typed deltas over one base graph. YAML edits, API graph edits, and provider
  proposals use the same delta shape.
