text: One record per file supports focused diffs and merges. Human-authored IDs should
  be stable opaque slugs/UUIDs rather than mutable display names. V0 inferred entity
  IDs are deterministic from case-folded names, and inferred alias IDs include the
  entity ID and alias name; renaming an extracted entity or alias can create a new
  ID. Evidence anchors use separate source/content/structure identity and can survive
  such renames when the same passage relocates unambiguously. `config.yaml` selects
  a schema version, extraction/index preferences, and model connection IDs by purpose;
  it excludes credentials. `instructions.md` contains human extraction hints, not
  required syntax for source documents.
