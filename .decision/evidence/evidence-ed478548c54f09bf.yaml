text: The repository is the durable boundary. Source Markdown remains untouched input.
  A small `.decision/` tree stores validated, human-readable YAML records and schema
  files. Evidence anchors are canonical records with reference integrity; claims,
  aliases, decisions, options, and consequences cite them by ID. The backend loads
  these plus discovered Markdown into a deterministic domain model, applies precedence
  rules, compiles graph/scenario views, and rebuilds indexes. UI and conversational
  edits call domain operations that update the same portable records; YAML edits are
  validated and reloaded through the same compiler.
