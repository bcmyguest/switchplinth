  normalized_passage_sha256: 514cd1f504f4629ffb094f70f7a7cef766689b6db1d711bc7704edad7d95e05e
  context_before: We chose Apache Kafka because replay and ordering across fulfillment events matter more than operating a managed queue. The Order Service publishes order events to Kafka, and the Fulfillment Service consumes them.
  context_after: The team operates Kafka and monitors consumer lag. The decision can be revisited if operational load becomes more important than replay.
text: Amazon SQS would reduce infrastructure work. A dead-letter queue would hold messages after repeated failures, but replaying a selected range of old events would require extra application support.
