[project]
name = "switchplinth"
version = "0.1.0"
description = "Local-first architecture decisions from Markdown and portable YAML"
license = "Apache-2.0"
readme = "README.md"
authors = [
    { name = "bcmyguest", email = "29989722+bcmyguest@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "litellm>=1.60",
    "mcp>=1.9,<2",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "qdrant-client>=1.12",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
switchplinth = "switchplinth.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "switchplinth"
