<svg xmlns="http://www.w3.org/2000/svg" class="pl-sheet" viewBox="0 0 360 1124" width="360" height="1124" role="img" aria-labelledby="pl-title-tall pl-desc-tall"><title id="pl-title-tall">How repository Markdown becomes decisions, a graph, and answers</title><desc id="pl-desc-tall">Pipeline in ten steps. 1: Markdown files, canonical and never written. 2: discovery skips generated, metadata, and configured paths. 3: passages become evidence anchors with path, heading path, passage hash, and context. 4: extraction by mock rules or a LiteLLM model, with one schema-feedback retry for invalid deltas. 5: validation against the record-v1 schema on save and references on read. 6: canonical .decision/ YAML, one file per record. 7: human review reads records and appends judgments, including undo. 8: the compiler applies selected option deltas to the base graph per request and reports conflicts and invalid assumptions. 9: disposable SQLite FTS5 and vector indexes, rebuilt from the YAML. 10: consumers through FastAPI: the map and What-if, why-search, and four MCP tools.</desc><style>svg{--c-canvas:#f3f4f1;--c-panel:#ffffff;--c-panel-raised:#f8faf8;--c-ink:#202522;--c-muted:#59665c;--c-line:#e6e9e4;--c-brand:#557b66;--c-brand-soft:#e8f0eb;--c-selected:#dcebdd;--c-hover:#f2f7f2;--c-map-canvas:#edf2ed;--c-map-dot:#d5e0d7;--c-source:#355e42;--c-code:#f6f6f2;--c-warning:#704910;--c-danger:#8d3834;}@media (prefers-color-scheme: dark){svg{--c-canvas:#111713;--c-panel:#19211b;--c-panel-raised:#202a22;--c-ink:#edf4ee;--c-muted:#bdc8be;--c-line:#3a4a3d;--c-brand:#a6d0ae;--c-brand-soft:#263b2c;--c-selected:#2b4933;--c-hover:#29382d;--c-map-canvas:#121b15;--c-map-dot:#2a392d;--c-source:#bfe4c8;--c-code:#151c16;--c-warning:#f0cc83;--c-danger:#ffb7b1;}}
.pl-sheet { --pl-mono: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; --pl-sans: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; }
.pl-bg { fill: var(--c-map-canvas); }
.pl-grid-minor { fill: none; stroke: var(--c-map-dot); stroke-width: 0.5; opacity: 0.45; }
.pl-grid-major { fill: none; stroke: var(--c-map-dot); stroke-width: 1; }

.pl-card { fill: var(--c-panel); stroke: var(--c-line); stroke-width: 1.25; }
.pl-canonical .pl-card { stroke: var(--c-brand); stroke-width: 2.25; }
.pl-disposable .pl-card { fill: var(--c-panel-raised); stroke: var(--c-muted); stroke-width: 1.5; stroke-dasharray: 6 4; }

.pl-badge { fill: var(--c-brand-soft); }
.pl-num { fill: var(--c-source); font: 700 11px var(--pl-sans); }
.pl-title { fill: var(--c-ink); font: 600 14.5px var(--pl-sans); }
.pl-text { fill: var(--c-muted); font: 400 12px var(--pl-sans); }
.pl-code { fill: var(--c-source); font: 500 11px var(--pl-mono); }
.pl-tag { font: 700 9.5px var(--pl-mono); letter-spacing: 0.08em; fill: var(--c-muted); }
.pl-canonical .pl-tag { fill: var(--c-source); }
.pl-chip { fill: var(--c-brand-soft); stroke: var(--c-line); stroke-width: 1; }
.pl-chip-text { fill: var(--c-ink); font: 600 11px var(--pl-sans); }

.pl-edge { fill: none; stroke: var(--c-brand); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.pl-edge.pl-rebuild { stroke: var(--c-muted); stroke-width: 1.5; stroke-dasharray: 5 4; }
.pl-tip { fill: var(--c-brand); }
.pl-tip.pl-rebuild { fill: var(--c-muted); }
.pl-edge-label { font: 600 9.5px var(--pl-mono); letter-spacing: 0.06em; fill: var(--c-muted); paint-order: stroke; stroke: var(--c-map-canvas); stroke-width: 4px; stroke-linejoin: round; }

.pl-heading { font: 700 10px var(--pl-mono); letter-spacing: 0.1em; fill: var(--c-muted); }
.pl-legend-text { fill: var(--c-ink); font: 400 12px var(--pl-sans); }
.pl-block rect { fill: var(--c-panel); stroke: var(--c-line); }
.pl-block path { stroke: var(--c-line); }
.pl-block text { fill: var(--c-muted); font: 600 9px var(--pl-mono); letter-spacing: 0.08em; }</style><defs><pattern id="pl-grid-minor-tall" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M12 0H0V12" class="pl-grid-minor"></path></pattern><pattern id="pl-grid-tall" width="60" height="60" patternUnits="userSpaceOnUse"><rect width="60" height="60" fill="url(#pl-grid-minor-tall)"></rect><path d="M60 0H0V60" class="pl-grid-major"></path></pattern></defs><rect class="pl-bg" width="360" height="1124"></rect><rect width="360" height="1124" fill="url(#pl-grid-tall)"></rect><text class="pl-heading" x="16" y="24">MARKDOWN TO DECISIONS</text><path class="pl-edge" d="M180 132 V157"></path><polygon class="pl-tip" points="180,166 175.5,158 184.5,158"></polygon><path class="pl-edge" d="M180 258 V283"></path><polygon class="pl-tip" points="180,292 175.5,284 184.5,284"></polygon><path class="pl-edge" d="M180 384 V409"></path><polygon class="pl-tip" points="180,418 175.5,410 184.5,410"></polygon><path class="pl-edge" d="M180 510 V535"></path><polygon class="pl-tip" points="180,544 175.5,536 184.5,536"></polygon><path class="pl-edge" d="M180 636 V638 Q180 646 172 646 H102 Q94 646 94 654 V661"></path><polygon class="pl-tip" points="94,670 89.5,662 98.5,662"></polygon><path class="pl-edge" d="M172 702 H179"></path><polygon class="pl-tip" points="188,702 180,697.5 180,706.5"></polygon><path class="pl-edge" d="M188 730 H181"></path><polygon class="pl-tip" points="172,730 180,725.5 180,734.5"></polygon><path class="pl-edge" d="M94 762 V787"></path><polygon class="pl-tip" points="94,796 89.5,788 98.5,788"></polygon><path class="pl-edge pl-rebuild" d="M150 762 V764 Q150 772 158 772 H258 Q266 772 266 780 V787"></path><polygon class="pl-tip pl-rebuild" points="266,796 261.5,788 270.5,788"></polygon><path class="pl-edge" d="M94 888 V913"></path><polygon class="pl-tip" points="94,922 89.5,914 98.5,914"></polygon><path class="pl-edge" d="M266 888 V913"></path><polygon class="pl-tip" points="266,922 261.5,914 270.5,914"></polygon><text class="pl-edge-label" x="190" y="531" text-anchor="start">INFERRED RECORDS</text><text class="pl-edge-label" x="196" y="787" text-anchor="start">REBUILD</text><g class="pl-node pl-canonical" transform="translate(16 40)"><rect class="pl-card" width="328" height="92" rx="10"></rect><text class="pl-tag" x="328" y="-6" text-anchor="end">CANONICAL</text><circle class="pl-badge" cx="22" cy="22" r="11"></circle><text class="pl-num" x="22" y="26" text-anchor="middle">1</text><text class="pl-title" x="40" y="27">Markdown files</text><text class="pl-text" x="14" y="50">ADRs, RFCs, design docs, READMEs;</text><text class="pl-text" x="14" y="67">any headings, no template;</text><text class="pl-text" x="14" y="84">read, never written</text></g><g class="pl-node" transform="translate(16 166)"><rect class="pl-card" width="328" height="92" rx="10"></rect><circle class="pl-badge" cx="22" cy="22" r="11"></circle><text class="pl-num" x="22" y="26" text-anchor="middle">2</text><text class="pl-title" x="40" y="27">Discovery</text><text class="pl-code" x="14" y="50">discover_markdown()</text><text class="pl-text" x="14" y="67">skips generated and metadata folders</text><text class="pl-text" x="14" y="84">plus configured ignore paths</text></g><g class="pl-node" transform="translate(16 292)"><rect class="pl-card" width="328" height="92" rx="10"></rect><circle class="pl-badge" cx="22" cy="22" r="11"></circle><text class="pl-num" x="22" y="26" text-anchor="middle">3</text><text class="pl-title" x="40" y="27">Passages and evidence anchors</text><text class="pl-code" x="14" y="50">passages(), evidence_anchor()</text><text class="pl-text" x="14" y="67">path, heading path, passage hash,</text><text class="pl-text" x="14" y="84">context; relocated on rescans</text></g><g class="pl-node" transform="translate(16 418)"><rect class="pl-card" width="328" height="92" rx="10"></rect><circle class="pl-badge" cx="22" cy="22" r="11"></circle><text class="pl-num" x="22" y="26" text-anchor="middle">4</text><text class="pl-title" x="40" y="27">Extraction</text><text class="pl-text" x="14" y="82">invalid deltas get one schema-feedback retry</text><rect class="pl-chip" x="12" y="38" width="86" height="24" rx="6"></rect><text class="pl-chip-text" x="21" y="54">mock rules</text><rect class="pl-chip" x="106" y="38" width="106" height="24" rx="6"></rect><text class="pl-chip-text" x="115" y="54">LiteLLM model</text></g><g class="pl-node" transform="translate(16 544)"><rect class="pl-card" width="328" height="92" rx="10"></rect><circle class="pl-badge" cx="22" cy="22" r="11"></circle><text class="pl-num" x="22" y="26" text-anchor="middle">5</text><text class="pl-title" x="40" y="27">Validation</text><text class="pl-text" x="14" y="50">record-v1 schema and record rules</text><text class="pl-text" x="14" y="67">on every save; cross-record</text><text class="pl-text" x="14" y="84">references on every read</text></g><g class="pl-node pl-canonical" transform="translate(16 670)"><rect class="pl-card" width="156" height="92" rx="10"></rect><text class="pl-tag" x="156" y="-6" text-anchor="end">CANONICAL</text><circle class="pl-badge" cx="22" cy="22" r="11"></circle><text class="pl-num" x="22" y="26" text-anchor="middle">6</text><text class="pl-title" x="40" y="27">.decision/ YAML</text><text class="pl-text" x="14" y="50">file per record,</text><text class="pl-text" x="14" y="67">inferred and human,</text><text class="pl-text" x="14" y="84">atomic per file</text></g><g class="pl-node" transform="translate(188 670)"><rect class="pl-card" width="156" height="92" rx="10"></rect><circle class="pl-badge" cx="22" cy="22" r="11"></circle><text class="pl-num" x="22" y="26" text-anchor="middle">7</text><text class="pl-title" x="40" y="27">Human review</text><text class="pl-text" x="14" y="50">confirm, reject,</text><text class="pl-text" x="14" y="67">correct, undo;</text><text class="pl-text" x="14" y="84">always appends</text></g><g class="pl-node" transform="translate(16 796)"><rect class="pl-card" width="156" height="92" rx="10"></rect><text class="pl-tag" x="156" y="-6" text-anchor="end">PER REQUEST</text><circle class="pl-badge" cx="22" cy="22" r="11"></circle><text class="pl-num" x="22" y="26" text-anchor="middle">8</text><text class="pl-title" x="40" y="27">Compiler</text><text class="pl-text" x="14" y="50">base graph + deltas;</text><text class="pl-text" x="14" y="67">conflicts, invalid</text><text class="pl-text" x="14" y="84">assumptions</text></g><g class="pl-node pl-disposable" transform="translate(188 796)"><rect class="pl-card" width="156" height="92" rx="10"></rect><text class="pl-tag" x="156" y="-6" text-anchor="end">DISPOSABLE</text><circle class="pl-badge" cx="22" cy="22" r="11"></circle><text class="pl-num" x="22" y="26" text-anchor="middle">9</text><text class="pl-title" x="40" y="27">Indexes</text><text class="pl-text" x="14" y="50">SQLite FTS5,</text><text class="pl-text" x="14" y="67">Qdrant or local</text><text class="pl-text" x="14" y="84">vectors; rebuilt</text></g><g class="pl-node" transform="translate(16 922)"><rect class="pl-card" width="328" height="92" rx="10"></rect><circle class="pl-badge" cx="22" cy="22" r="11"></circle><text class="pl-num" x="22" y="26" text-anchor="middle">10</text><text class="pl-title" x="40" y="27">Consumers</text><text class="pl-code" x="14" y="50">FastAPI</text><rect class="pl-chip" x="12" y="60" width="100" height="24" rx="6"></rect><text class="pl-chip-text" x="21" y="76">Map, What-if</text><rect class="pl-chip" x="120" y="60" width="86" height="24" rx="6"></rect><text class="pl-chip-text" x="129" y="76">Why-search</text><rect class="pl-chip" x="214" y="60" width="79" height="24" rx="6"></rect><text class="pl-chip-text" x="223" y="76">MCP tools</text></g><g transform="translate(16 1040)"><rect class="pl-card" x="0" y="0" width="26" height="16" rx="4" style="stroke: var(--c-brand); stroke-width: 2.25"></rect><text class="pl-legend-text" x="36" y="12">Canonical: kept in Git</text><rect class="pl-card" x="0" y="28" width="26" height="16" rx="4" style="fill: var(--c-panel-raised); stroke: var(--c-muted); stroke-width: 1.5; stroke-dasharray: 6 4"></rect><text class="pl-legend-text" x="36" y="40">Disposable: rebuildable</text><rect class="pl-card" x="0" y="56" width="26" height="16" rx="4"></rect><text class="pl-legend-text" x="36" y="68">Process step</text></g></svg>
