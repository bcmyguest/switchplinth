title: Event delivery for order processing
status: decided
epistemic_state: inferred
context: We chose Apache Kafka because replay and ordering across fulfillment events
  matter more than operating a managed queue. The Order Service publishes order events
  to Kafka, and the Fulfillment Service consumes them.
