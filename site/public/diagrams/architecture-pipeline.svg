<svg xmlns="http://www.w3.org/2000/svg" class="pl-sheet" viewBox="0 0 840 476" width="840" height="476" role="img" aria-labelledby="pl-title-wide pl-desc-wide"><title id="pl-title-wide">How repository Markdown becomes decisions, a graph, and answers</title><desc id="pl-desc-wide">Pipeline in ten steps. 1: Markdown files, canonical and never written. 2: discovery skips hidden, generated, and configured paths. 3: passages become evidence anchors with path, heading path, passage hash, and context. 4: extraction by mock rules or a LiteLLM model, with one schema-feedback retry for invalid deltas. 5: validation against the record-v1 schema on save and references on read. 6: canonical .decision/ YAML, one file per record. 7: human review reads records and appends judgments, including undo. 8: the compiler applies selected option deltas to the base graph per request and reports conflicts and invalid assumptions. 9: disposable SQLite FTS5 and vector indexes, rebuilt from the YAML. 10: consumers through the FastAPI API: the map and What-if, why-search, and four MCP tools.</desc><style>svg{--c-canvas:#f3f4f1;--c-panel:#ffffff;--c-panel-raised:#f8faf8;--c-ink:#202522;--c-muted:#59665c;--c-line:#e6e9e4;--c-brand:#557b66;--c-brand-soft:#e8f0eb;--c-selected:#dcebdd;--c-hover:#f2f7f2;--c-map-canvas:#edf2ed;--c-map-dot:#d5e0d7;--c-source:#355e42;--c-code:#f6f6f2;--c-warning:#704910;--c-danger:#8d3834;}@media (prefers-color-scheme: dark){svg{--c-canvas:#111713;--c-panel:#19211b;--c-panel-raised:#202a22;--c-ink:#edf4ee;--c-muted:#bdc8be;--c-line:#3a4a3d;--c-brand:#a6d0ae;--c-brand-soft:#263b2c;--c-selected:#2b4933;--c-hover:#29382d;--c-map-canvas:#121b15;--c-map-dot:#2a392d;--c-source:#bfe4c8;--c-code:#151c16;--c-warning:#f0cc83;--c-danger:#ffb7b1;}}
.pl-sheet { --pl-mono: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; --pl-sans: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; }
.pl-bg { fill: var(--c-map-canvas); }
.pl-grid-minor { fill: none; stroke: var(--c-map-dot); stroke-width: 0.5; opacity: 0.45; }
.pl-grid-major { fill: none; stroke: var(--c-map-dot); stroke-width: 1; }

.pl-card { fill: var(--c-panel); stroke: var(--c-line); stroke-width: 1.25; }
.pl-canonical .pl-card { stroke: var(--c-brand); stroke-width: 2.25; }
.pl-disposable .pl-card { fill: var(--c-panel-raised); stroke: var(--c-muted); stroke-width: 1.5; stroke-dasharray: 6 4; }

.pl-badge { fill: var(--c-brand-soft); }
.pl-num { fill: var(--c-source); font: 700 11px var(--pl-sans); }
.pl-title { fill: var(--c-ink); font: 600 14.5px var(--pl-sans); }
.pl-text { fill: var(--c-muted); font: 400 12px var(--pl-sans); }
.pl-code { fill: var(--c-source); font: 500 11px var(--pl-mono); }
.pl-tag { font: 700 9.5px var(--pl-mono); letter-spacing: 0.08em; fill: var(--c-muted); }
.pl-canonical .pl-tag { fill: var(--c-source); }
.pl-chip { fill: var(--c-brand-soft); stroke: var(--c-line); stroke-width: 1; }
.pl-chip-text { fill: var(--c-ink); font: 600 11px var(--pl-sans); }

.pl-edge { fill: none; stroke: var(--c-brand); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.pl-edge.pl-rebuild { stroke: var(--c-muted); stroke-width: 1.5; stroke-dasharray: 5 4; }
.pl-tip { fill: var(--c-brand); }
.pl-tip.pl-rebuild { fill: var(--c-muted); }
.pl-edge-label { font: 600 9.5px var(--pl-mono); letter-spacing: 0.06em; fill: var(--c-muted); paint-order: stroke; stroke: var(--c-map-canvas); stroke-width: 4px; stroke-linejoin: round; }

.pl-heading { font: 700 10px var(--pl-mono); letter-spacing: 0.1em; fill: var(--c-muted); }
.pl-legend-text { fill: var(--c-ink); font: 400 12px var(--pl-sans); }
.pl-block rect { fill: var(--c-panel); stroke: var(--c-line); }
.pl-block path { stroke: var(--c-line); }
.pl-block text { fill: var(--c-muted); font: 600 9px var(--pl-mono); letter-spacing: 0.08em; }</style><defs><pattern id="pl-grid-minor-wide" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M12 0H0V12" class="pl-grid-minor"></path></pattern><pattern id="pl-grid-wide" width="60" height="60" patternUnits="userSpaceOnUse"><rect width="60" height="60" fill="url(#pl-grid-minor-wide)"></rect><path d="M60 0H0V60" class="pl-grid-major"></path></pattern></defs><rect class="pl-bg" width="840" height="476"></rect><rect width="840" height="476" fill="url(#pl-grid-wide)"></rect><text class="pl-heading" x="12" y="24">MARKDOWN TO DECISIONS</text><path class="pl-edge" d="M192 94 H215"></path><polygon class="pl-tip" points="224,94 216,89.5 216,98.5"></polygon><path class="pl-edge" d="M404 94 H427"></path><polygon class="pl-tip" points="436,94 428,89.5 428,98.5"></polygon><path class="pl-edge" d="M616 94 H639"></path><polygon class="pl-tip" points="648,94 640,89.5 640,98.5"></polygon><path class="pl-edge" d="M738 140 V152 Q738 160 730 160 H110 Q102 160 102 168 V175"></path><polygon class="pl-tip" points="102,184 97.5,176 106.5,176"></polygon><path class="pl-edge" d="M192 230 H215"></path><polygon class="pl-tip" points="224,230 216,225.5 216,234.5"></polygon><path class="pl-edge" d="M404 230 H427"></path><polygon class="pl-tip" points="436,230 428,225.5 428,234.5"></polygon><path class="pl-edge" d="M616 230 H639"></path><polygon class="pl-tip" points="648,230 640,225.5 640,234.5"></polygon><path class="pl-edge" d="M284 276 V319"></path><polygon class="pl-tip" points="284,328 279.5,320 288.5,320"></polygon><path class="pl-edge" d="M344 328 V285"></path><polygon class="pl-tip" points="344,276 339.5,284 348.5,284"></polygon><path class="pl-edge pl-rebuild" d="M404 258 H412 Q420 258 420 266 V366 Q420 374 427 374"></path><polygon class="pl-tip pl-rebuild" points="436,374 428,369.5 428,378.5"></polygon><path class="pl-edge" d="M616 374 H639"></path><polygon class="pl-tip" points="648,374 640,369.5 640,378.5"></polygon><text class="pl-edge-label" x="420" y="156" text-anchor="middle">INFERRED RECORDS</text><text class="pl-edge-label" x="278" y="306" text-anchor="end">READ</text><text class="pl-edge-label" x="350" y="306" text-anchor="start">APPEND</text><text class="pl-edge-label" x="426" y="300" text-anchor="start">REBUILD</text><g class="pl-node pl-canonical" transform="translate(12 48)"><rect class="pl-card" width="180" height="92" rx="10"></rect><text class="pl-tag" x="180" y="-6" text-anchor="end">CANONICAL</text><circle class="pl-badge" cx="22" cy="22" r="11"></circle><text class="pl-num" x="22" y="26" text-anchor="middle">1</text><text class="pl-title" x="40" y="27">Markdown files</text><text class="pl-text" x="14" y="50">ADRs, RFCs, design docs,</text><text class="pl-text" x="14" y="67">READMEs, any headings;</text><text class="pl-text" x="14" y="84">read, never written</text></g><g class="pl-node" transform="translate(224 48)"><rect class="pl-card" width="180" height="92" rx="10"></rect><circle class="pl-badge" cx="22" cy="22" r="11"></circle><text class="pl-num" x="22" y="26" text-anchor="middle">2</text><text class="pl-title" x="40" y="27">Discovery</text><text class="pl-code" x="14" y="50">discover_markdown()</text><text class="pl-text" x="14" y="67">skips hidden, generated,</text><text class="pl-text" x="14" y="84">and configured paths</text></g><g class="pl-node" transform="translate(436 48)"><rect class="pl-card" width="180" height="92" rx="10"></rect><circle class="pl-badge" cx="22" cy="22" r="11"></circle><text class="pl-num" x="22" y="26" text-anchor="middle">3</text><text class="pl-title" x="40" y="27">Passages, anchors</text><text class="pl-code" x="14" y="50">passages()</text><text class="pl-text" x="14" y="67">path, headings, hash,</text><text class="pl-text" x="14" y="84">context; relocatable</text></g><g class="pl-node" transform="translate(648 48)"><rect class="pl-card" width="180" height="92" rx="10"></rect><circle class="pl-badge" cx="22" cy="22" r="11"></circle><text class="pl-num" x="22" y="26" text-anchor="middle">4</text><text class="pl-title" x="40" y="27">Extraction</text><text class="pl-text" x="14" y="82">LiteLLM, one fix-up retry</text><rect class="pl-chip" x="12" y="38" width="86" height="24" rx="6"></rect><text class="pl-chip-text" x="21" y="54">mock rules</text><rect class="pl-chip" x="106" y="38" width="52" height="24" rx="6"></rect><text class="pl-chip-text" x="115" y="54">model</text></g><g class="pl-node" transform="translate(12 184)"><rect class="pl-card" width="180" height="92" rx="10"></rect><circle class="pl-badge" cx="22" cy="22" r="11"></circle><text class="pl-num" x="22" y="26" text-anchor="middle">5</text><text class="pl-title" x="40" y="27">Validation</text><text class="pl-text" x="14" y="50">record-v1 schema and</text><text class="pl-text" x="14" y="67">record rules on save;</text><text class="pl-text" x="14" y="84">references on read</text></g><g class="pl-node pl-canonical" transform="translate(224 184)"><rect class="pl-card" width="180" height="92" rx="10"></rect><text class="pl-tag" x="180" y="-6" text-anchor="end">CANONICAL</text><circle class="pl-badge" cx="22" cy="22" r="11"></circle><text class="pl-num" x="22" y="26" text-anchor="middle">6</text><text class="pl-title" x="40" y="27">.decision/ YAML</text><text class="pl-text" x="14" y="50">one YAML file per record,</text><text class="pl-text" x="14" y="67">inferred and human,</text><text class="pl-text" x="14" y="84">atomic replace per file</text></g><g class="pl-node" transform="translate(224 328)"><rect class="pl-card" width="180" height="92" rx="10"></rect><circle class="pl-badge" cx="22" cy="22" r="11"></circle><text class="pl-num" x="22" y="26" text-anchor="middle">7</text><text class="pl-title" x="40" y="27">Human review</text><text class="pl-text" x="14" y="50">confirm, reject, correct;</text><text class="pl-text" x="14" y="67">each judgment appends;</text><text class="pl-text" x="14" y="84">undo appends too</text></g><g class="pl-node" transform="translate(436 184)"><rect class="pl-card" width="180" height="92" rx="10"></rect><text class="pl-tag" x="180" y="-6" text-anchor="end">PER REQUEST</text><circle class="pl-badge" cx="22" cy="22" r="11"></circle><text class="pl-num" x="22" y="26" text-anchor="middle">8</text><text class="pl-title" x="40" y="27">Compiler</text><text class="pl-code" x="14" y="50">compile_scenario()</text><text class="pl-text" x="14" y="67">graph + option deltas</text><text class="pl-text" x="14" y="84">conflicts, assumptions</text></g><g class="pl-node pl-disposable" transform="translate(436 328)"><rect class="pl-card" width="180" height="92" rx="10"></rect><text class="pl-tag" x="180" y="-6" text-anchor="end">DISPOSABLE</text><circle class="pl-badge" cx="22" cy="22" r="11"></circle><text class="pl-num" x="22" y="26" text-anchor="middle">9</text><text class="pl-title" x="40" y="27">Indexes</text><text class="pl-text" x="14" y="50">SQLite FTS5 passages,</text><text class="pl-text" x="14" y="67">Qdrant or local vectors;</text><text class="pl-text" x="14" y="84">rebuilt after each scan</text></g><g class="pl-node" transform="translate(648 184)"><rect class="pl-card" width="180" height="236" rx="10"></rect><circle class="pl-badge" cx="22" cy="22" r="11"></circle><text class="pl-num" x="22" y="26" text-anchor="middle">10</text><text class="pl-title" x="40" y="27">Consumers</text><text class="pl-code" x="14" y="50">FastAPI /api/v1</text><rect class="pl-chip" x="12" y="64" width="156" height="34" rx="7"></rect><text class="pl-chip-text" x="24" y="85">Map and What-if</text><rect class="pl-chip" x="12" y="112" width="156" height="34" rx="7"></rect><text class="pl-chip-text" x="24" y="133">Why-search, grounded</text><rect class="pl-chip" x="12" y="160" width="156" height="34" rx="7"></rect><text class="pl-chip-text" x="24" y="181">MCP: 4 read-only tools</text></g><g transform="translate(12 336)"><rect class="pl-card" x="0" y="0" width="26" height="16" rx="4" style="stroke: var(--c-brand); stroke-width: 2.25"></rect><text class="pl-legend-text" x="36" y="12">Canonical: kept in Git</text><rect class="pl-card" x="0" y="30" width="26" height="16" rx="4" style="fill: var(--c-panel-raised); stroke: var(--c-muted); stroke-width: 1.5; stroke-dasharray: 6 4"></rect><text class="pl-legend-text" x="36" y="42">Disposable: rebuildable</text><rect class="pl-card" x="0" y="60" width="26" height="16" rx="4"></rect><text class="pl-legend-text" x="36" y="72">Process step</text></g><g class="pl-block" transform="translate(612 438)"><rect width="216" height="26" rx="4"></rect><path d="M96 0V26M154 0V26"></path><text x="8" y="17">SWITCHPLINTH</text><text x="104" y="17">A-102</text><text x="162" y="17">PIPELINE</text></g></svg>
